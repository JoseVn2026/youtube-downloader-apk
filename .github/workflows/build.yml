name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y autoconf automake libtool cmake libncurses5-dev libssl-dev openjdk-17-jdk wget unzip python3-pip

      - name: Instalar Buildozer
        run: pip install buildozer

      - name: Descargar NDK 25c
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME/.buildozer/android/platform/
          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25c" >> $GITHUB_ENV

      - name: Descargar binario ffmpeg para Android
        run: |
          # Descarga directa a la raíz del proyecto (se incluirá con android.add_src)
          wget -q "https://github.com/nicko88/ffmpeg-android/releases/download/0.6.3/ffmpeg" -O ffmpeg
          chmod +x ffmpeg

      - name: Compilar APK
        run: buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
