name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v3

      - name: Compilar APK
        run: |
          export BUILDOZER_ACCEPT_ROOT=1
          buildozer android debug
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
