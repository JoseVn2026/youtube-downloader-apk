name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y autoconf automake libtool cmake libncurses5-dev libssl-dev openjdk-17-jdk wget unzip python3-pip

      - name: Instalar Buildozer
        run: |
          pip install buildozer

      - name: Descargar NDK 25c manualmente (con ruta absoluta)
        run: |
          # Crear el directorio base para el NDK (ruta absoluta)
          mkdir -p /home/runner/.buildozer/android/platform
          # Descargar y extraer el NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /home/runner/.buildozer/android/platform/
          # Verificar que se extrajo correctamente
          ls -la /home/runner/.buildozer/android/platform/
          echo "NDK instalado en /home/runner/.buildozer/android/platform/android-ndk-r25c"

      - name: Compilar APK
        run: |
          buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
