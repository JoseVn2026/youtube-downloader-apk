name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y autoconf automake libtool cmake libncurses5-dev libssl-dev openjdk-17-jdk wget unzip python3-pip

      - name: Instalar Buildozer
        run: pip install buildozer

      - name: Descargar NDK 25c
        run: |
          mkdir -p /home/runner/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /home/runner/.buildozer/android/platform/

      - name: Configurar variables de entorno para Buildozer
        run: |
          echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r25c" >> $GITHUB_ENV
          echo "ANDROIDSDK=/home/runner/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk

      - name: Preparar ffmpeg_bin (sin errores)
        run: |
          # Si ffmpeg_bin NO es un directorio (p.ej. es un archivo), lo borramos sin fallar
          test -d ffmpeg_bin || rm -f ffmpeg_bin
          mkdir -p ffmpeg_bin
          wget -q "https://github.com/nicko88/ffmpeg-android/releases/download/0.6.3/ffmpeg" -O ffmpeg_bin/ffmpeg
          chmod +x ffmpeg_bin/ffmpeg

      - name: Compilar APK
        run: buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
